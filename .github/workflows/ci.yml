name: CI — Run Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java (required by PySpark)
        run: sudo apt-get install -y openjdk-11-jdk

      - name: Install dependencies
        run: |
          pip install pyspark>=3.5.0 pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Upload coverage report
        if: always()
        run: pytest tests/ --cov=pyspark_jobs --cov-report=term-missing || true
